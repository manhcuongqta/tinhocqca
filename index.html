<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi Tin học Online - Tiểu học Quỳnh Châu</title>
    
    <!-- Google Fonts (Font chữ hiện đại, dễ đọc cho học sinh tiểu học) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons (Biểu tượng sinh động) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cấu hình Tailwind (Thêm font chữ trẻ em thân thiện) -->

        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Nunito', 'Fredoka', 'sans-serif'],

        }

    <!-- Thư viện tạo hiệu ứng pháo hoa chúc mừng khi đạt điểm cao -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Các hiệu ứng chuyển động tùy chỉnh bằng CSS -->
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f8fafc;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes scaleUp {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-scale-up {
            animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="text-gray-700 antialiased selection:bg-indigo-100 selection:text-indigo-900">

    <!-- Điểm gắn kết của ứng dụng React -->
    <div id="root">
        <!-- Trạng thái loading trước khi React được tải -->
        <div class="min-h-screen flex flex-col items-center justify-center bg-indigo-50/20">
            <div class="text-center space-y-4">
                <div class="inline-block animate-spin text-indigo-600">
                    <i class="fas fa-circle-notch text-5xl"></i>
                </div>
                <h2 class="text-xl font-bold text-indigo-950 uppercase tracking-wider">
                    Đang khởi động hệ thống...
                </h2>
                <p class="text-gray-400 text-xs">Vui lòng chờ trong giây lát</p>
            </div>
        </div>
    </div>

    <!-- Tải React & ReactDOM từ CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Tải Babel để chạy trực tiếp JSX trong trình duyệt -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Toàn bộ mã nguồn ứng dụng (Dữ liệu + Logic) được nhúng trực tiếp để tránh lỗi CORS khi mở bằng file:// -->
    <script type="text/babel">
        // 1. DỮ LIỆU CÂU HỎI MẪU
        const DEFAULT_EXAMS = [
          {
            id: "exam-khoi-3",
            title: "Khảo sát kiến thức Tin học - Khối 3",
            description: "Bài thi trắc nghiệm tìm hiểu về các bộ phận máy tính và thao tác cơ bản.",
            grade: 3,
            duration: 10,
            questions: [
              {
                id: "q3_1",
                question: "Bộ phận nào của máy tính dùng để nhập chữ và số vào máy tính?",
                options: ["Chuột máy tính", "Màn hình máy tính", "Bàn phím máy tính", "Thân máy tính"],
                answer: 2,
                explanation: "Bàn phím chứa các phím chữ, số và ký tự đặc biệt giúp ta nhập thông tin văn bản vào máy tính."
              },
              {
                id: "q3_2",
                question: "Bộ phận nào được ví như 'bộ não' điều khiển mọi hoạt động của máy tính?",
                options: ["Màn hình (Monitor)", "Thân máy (chứa bộ xử lý trung tâm - CPU)", "Chuột (Mouse)", "Loa (Speaker)"],
                answer: 1,
                explanation: "Bộ xử lý trung tâm (CPU) nằm trong thân máy tính, thực hiện nhiệm vụ xử lý dữ liệu và điều khiển mọi hoạt động của máy."
              },
              {
                id: "q3_3",
                question: "Chuột máy tính thường có hai nút cơ bản là những nút nào?",
                options: ["Nút trên và nút dưới", "Nút trái và nút phải", "Nút giữa và nút bên hông", "Không có nút nào"],
                answer: 1,
                explanation: "Chuột máy tính thông dụng có nút trái (dùng nhiều nhất) và nút phải để mở rộng tính năng."
              },
              {
                id: "q3_4",
                question: "Màn hình máy tính có chức năng gì?",
                options: ["Để gõ chữ", "Để điều khiển con trỏ", "Để hiển thị kết quả làm việc của máy tính", "Để phát ra âm thanh"],
                answer: 2,
                explanation: "Màn hình là thiết bị đầu ra giúp hiển thị văn bản, hình ảnh, video để người dùng nhìn thấy."
              },
              {
                id: "q3_5",
                question: "Để tắt máy tính một cách an toàn và đúng cách, em thực hiện thao tác nào?",
                options: [
                  "Rút phích cắm điện của máy tính ra trực tiếp",
                  "Nhấn giữ nút nguồn trên thân máy trong 10 giây",
                  "Vào Start -> Chọn nút Nguồn (Power) -> Chọn Shut down",
                  "Chỉ cần tắt màn hình máy tính là xong"
                ],
                answer: 2,
                explanation: "Tắt máy qua hệ điều hành (Start -> Power -> Shut down) giúp máy tính lưu lại trạng thái hệ thống trước khi ngắt điện hoàn toàn."
              }
            ]
          },
          {
            id: "exam-khoi-4",
            title: "Khảo sát kiến thức Tin học - Khối 4",
            description: "Bài thi tìm hiểu về hệ điều hành, soạn thảo văn bản Word và sử dụng Internet.",
            grade: 4,
            duration: 15,
            questions: [
              {
                id: "q4_1",
                question: "Để khởi động phần mềm soạn thảo văn bản Microsoft Word, em nháy đúp chuột vào biểu tượng nào?",
                options: [
                  "Biểu tượng chữ 'W' màu xanh dương",
                  "Biểu tượng chữ 'P' màu cam",
                  "Biểu tượng chữ 'X' màu xanh lá",
                  "Biểu tượng hình quả địa cầu"
                ],
                answer: 0,
                explanation: "Biểu tượng chữ W màu xanh dương là logo quen thuộc của phần mềm soạn thảo văn bản Microsoft Word."
              },
              {
                id: "q4_2",
                question: "Trong soạn thảo văn bản kiểu gõ TELEX, để gõ chữ 'â' em gõ phím nào?",
                options: ["gõ phím a và s", "gõ liên tiếp hai phím a (aa)", "gõ phím a và w", "gõ phím a và r"],
                answer: 1,
                explanation: "Theo quy tắc gõ TELEX: aa -> â, ee -> ê, oo -> ô, dd -> đ, uw -> ư, ow -> ơ."
              },
              {
                id: "q4_3",
                question: "Thư mục (Folder) trong máy tính được dùng để làm gì?",
                options: [
                  "Để trang trí cho máy tính đẹp hơn",
                  "Để lưu trữ và sắp xếp các tệp tin gọn gàng, khoa học",
                  "Để máy tính chạy nhanh hơn",
                  "Để kết nối Internet"
                ],
                answer: 1,
                explanation: "Thư mục giống như ngăn kéo tủ, giúp phân loại, sắp xếp các tài liệu, hình ảnh, bài học để dễ tìm kiếm."
              },
              {
                id: "q4_4",
                question: "Phần mềm nào sau đây là trình duyệt web dùng để truy cập thông tin trên mạng Internet?",
                options: ["Microsoft Paint", "Windows Media Player", "Google Chrome hoặc Cốc Cốc", "Microsoft Word"],
                answer: 2,
                explanation: "Google Chrome, Cốc Cốc, Microsoft Edge, Safari... là các ứng dụng trình duyệt web phổ biến."
              },
              {
                id: "q4_5",
                question: "Khi soạn thảo văn bản, phím nào trên bàn phím dùng để xuống dòng và bắt đầu một đoạn văn mới?",
                options: ["Phím cách (Spacebar)", "Phím Shift", "Phím Enter", "Phím Caps Lock"],
                answer: 2,
                explanation: "Phím Enter dùng để báo hiệu kết thúc một dòng hoặc một đoạn và di chuyển con trỏ xuống dòng tiếp theo."
              }
            ]
          },
          {
            id: "exam-khoi-5",
            title: "Khảo sát kiến thức Tin học - Khối 5",
            description: "Bài thi nâng cao về thiết kế trình chiếu PowerPoint, lập trình Scratch và thiết bị lưu trữ thông tin.",
            grade: 5,
            duration: 15,
            questions: [
              {
                id: "q5_1",
                question: "Phần mềm nào sau đây chuyên dùng để thiết kế bài trình chiếu và báo cáo?",
                options: ["Microsoft Word", "Microsoft PowerPoint", "Scratch", "Google Chrome"],
                answer: 1,
                explanation: "Microsoft PowerPoint cung cấp các công cụ thiết kế slide trình chiếu, hoạt họa sinh động hỗ trợ thuyết trình."
              },
              {
                id: "q5_2",
                question: "Trong phần mềm lập trình trực quan Scratch, nhân vật mặc định hiển thị lúc mới tạo dự án là gì?",
                options: ["Chú chó vàng", "Chú cá heo xanh", "Chú mèo vàng", "Chú chim bồ câu"],
                answer: 2,
                explanation: "Nhân vật mặc định và cũng là biểu tượng của Scratch là chú mèo (Scratch Cat)."
              },
              {
                id: "q5_3",
                question: "Thiết bị nào sau đây dùng để lưu trữ dữ liệu ngoài, nhỏ gọn và có thể cắm trực tiếp vào cổng USB của máy tính?",
                options: [
                  "Ổ đĩa CD/DVD",
                  "Bộ nhớ RAM",
                  "Thẻ nhớ hoặc thiết bị nhớ USB (Flash Drive)",
                  "Bộ xử lý CPU"
                ],
                answer: 2,
                explanation: "USB Flash Drive là thiết bị lưu trữ ngoài di động, dung lượng đa dạng, tiện lợi để trao đổi dữ liệu."
              },
              {
                id: "q5_4",
                question: "Để chèn thêm một hình ảnh minh họa từ máy tính vào trang slide trình chiếu PowerPoint, em chọn thẻ lệnh nào?",
                options: ["Thẻ Home", "Thẻ Design", "Thẻ Insert (chọn Pictures)", "Thẻ View"],
                answer: 2,
                explanation: "Thẻ 'Insert' (Chèn) chứa các chức năng chèn hình ảnh, bảng biểu, hình vẽ, hộp chữ (Text Box) vào trang chiếu."
              },
              {
                id: "q5_5",
                question: "Trong Scratch, khối lệnh màu vàng có chữ 'when green flag clicked' (khi nhấp vào cờ xanh) có tác dụng gì?",
                options: [
                  "Để nhân vật chạy nhanh hơn",
                  "Để xóa nhân vật hiện tại",
                  "Để khởi chạy chương trình khi người dùng nhấn nút cờ xanh",
                  "Để đổi màu nhân vật"
                ],
                answer: 2,
                explanation: "Cờ xanh là nút bắt đầu chạy kịch bản lập trình trong Scratch. Khối lệnh sự kiện này dùng để bắt đầu chạy các mã lệnh xếp phía dưới nó."
              }
            ]
          }
        ];

        // 2. LOGIC RENDER REACT APP
        const { useState, useEffect, useRef } = React;

        function App() {
          // --- Khởi tạo dữ liệu trong LocalStorage ---
          const [students, setStudents] = useState(() => {
            const saved = localStorage.getItem("qc_students");
            try {
              const parsed = saved ? JSON.parse(saved) : [];
              return Array.isArray(parsed) ? parsed : [];
            } catch(e) {
              return [];
            }
          });

          const [activeStudent, setActiveStudent] = useState(() => {
            const saved = localStorage.getItem("qc_active_student");
            try {
              return saved ? JSON.parse(saved) : null;
            } catch(e) {
              return null;
            }
          });

          const [exams, setExams] = useState(() => {
            const saved = localStorage.getItem("qc_exams");
            try {
              if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) {
                  return parsed.map(exam => ({
                    isOpen: exam.isOpen !== undefined ? exam.isOpen : true,
                    scheduleMode: exam.scheduleMode || "manual",
                    startTime: exam.startTime || "",
                    endTime: exam.endTime || "",
                    allowViewScore: exam.allowViewScore !== undefined ? exam.allowViewScore : true,
                    allowViewReview: exam.allowViewReview !== undefined ? exam.allowViewReview : true,
                    ...exam
                  }));
                }
              }
            } catch(e) {}
            localStorage.setItem("qc_exams", JSON.stringify(DEFAULT_EXAMS));
            return DEFAULT_EXAMS;
          });

          const [results, setResults] = useState(() => {
            const saved = localStorage.getItem("qc_results");
            try {
              const parsed = saved ? JSON.parse(saved) : [];
              return Array.isArray(parsed) ? parsed : [];
            } catch(e) {
              return [];
            }
          });

          // Trạng thái Quản lý Yêu cầu thi lại (Retake Requests)
          const [retakeRequests, setRetakeRequests] = useState(() => {
            const saved = localStorage.getItem("qc_retake_requests");
            try {
              const parsed = saved ? JSON.parse(saved) : [];
              return Array.isArray(parsed) ? parsed : [];
            } catch(e) {
              return [];
            }
          });

          // Trạng thái Giáo viên chỉnh sửa thời gian mở đề thi
          const [editingScheduleExam, setEditingScheduleExam] = useState(null);
          const [scheduleMode, setScheduleMode] = useState("manual");
          const [scheduleStartTime, setScheduleStartTime] = useState("");
          const [scheduleEndTime, setScheduleEndTime] = useState("");

          // Trạng thái bộ lọc cho tab Duyệt thi lại
          const [retakeFilterGrade, setRetakeFilterGrade] = useState("all");
          const [retakeFilterClass, setRetakeFilterClass] = useState("all");
          const [retakeFilterStatus, setRetakeFilterStatus] = useState("all");

          // --- Trạng thái giao diện ---
          const [currentScreen, setCurrentScreen] = useState(() => {
            const savedActive = localStorage.getItem("qc_active_student");
            try {
              if (savedActive) {
                const parsed = JSON.parse(savedActive);
                return parsed && parsed.id ? "student_dashboard" : "login";
              }
            } catch (e) {}
            return "login";
          });

          // Trạng thái đăng nhập
          const [loginUsername, setLoginUsername] = useState("");
          const [loginPassword, setLoginPassword] = useState("");
          const [loginError, setLoginError] = useState("");

          const [regName, setRegName] = useState("");
          const [regUsername, setRegUsername] = useState("");
          const [regPassword, setRegPassword] = useState("");
          const [regGrade, setRegGrade] = useState("3");
          const [regClass, setRegClass] = useState("");
          const [regError, setRegError] = useState("");
          const [regSuccess, setRegSuccess] = useState("");

          // Trạng thái Giáo viên đăng nhập
          const [teacherPassword, setTeacherPassword] = useState("");
          const [teacherError, setTeacherError] = useState("");
          const [teacherTab, setTeacherTab] = useState("results"); // 'results', 'students', 'exams', 'retakes'

          // Trạng thái Giáo viên thêm học sinh
          const [teacherRegName, setTeacherRegName] = useState("");
          const [teacherRegGrade, setTeacherRegGrade] = useState("3");
          const [teacherRegClass, setTeacherRegClass] = useState("");
          const [teacherRegUsername, setTeacherRegUsername] = useState("");
          const [teacherRegPassword, setTeacherRegPassword] = useState("123456");
          const [showAddStudentForm, setShowAddStudentForm] = useState(false);

          // Trạng thái Nhập danh sách học sinh (Bulk Import)
          const [showImportForm, setShowImportForm] = useState(false);
          const [importText, setImportText] = useState("");
          const [importGrade, setImportGrade] = useState("3");
          const [importClass, setImportClass] = useState("");
          const [importPassword, setImportPassword] = useState("123456");

          // Trạng thái bộ lọc cho tab Kết quả học sinh
          const [resultFilterGrade, setResultFilterGrade] = useState("all");
          const [resultFilterClass, setResultFilterClass] = useState("all");
          const [resultSearch, setResultSearch] = useState("");

          // Trạng thái bộ lọc cho tab Danh sách học sinh
          const [studentFilterGrade, setStudentFilterGrade] = useState("all");
          const [studentFilterClass, setStudentFilterClass] = useState("all");
          const [studentSearch, setStudentSearch] = useState("");

          // Trạng thái làm bài thi
          const [currentExam, setCurrentExam] = useState(null);
          const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
          const [studentAnswers, setStudentAnswers] = useState({}); // { questionId: selectedIndex }
          const [timeLeft, setTimeLeft] = useState(0); // giây
          const timerRef = useRef(null);
          const [showConfirmSubmit, setShowConfirmSubmit] = useState(false);

          // Trạng thái xem kết quả bài thi vừa hoàn thành
          const [latestResult, setLatestResult] = useState(null);
          const [showReview, setShowReview] = useState(false);

          // Trạng thái quản lý đề thi và câu hỏi ở trang giáo viên
          const [selectedExamForEdit, setSelectedExamForEdit] = useState(null);
          const [newQuestionText, setNewQuestionText] = useState("");
          const [newOptions, setNewOptions] = useState(["", "", "", ""]);
          const [newCorrectAnswer, setNewCorrectAnswer] = useState(0);
          const [newExplanation, setNewExplanation] = useState("");

          // Trạng thái tạo đề thi mới & chỉnh sửa tiêu đề/thông tin đề thi
          const [showCreateExamModal, setShowCreateExamModal] = useState(false);
          const [newExamTitle, setNewExamTitle] = useState("");
          const [newExamGrade, setNewExamGrade] = useState("3");
          const [newExamDuration, setNewExamDuration] = useState(15);
          const [newExamDescription, setNewExamDescription] = useState("");
          const [newExamAllowScore, setNewExamAllowScore] = useState(true);
          const [newExamAllowReview, setNewExamAllowReview] = useState(true);

          const [editExamTitle, setEditExamTitle] = useState("");
          const [editExamGrade, setEditExamGrade] = useState("3");
          const [editExamDuration, setEditExamDuration] = useState(15);
          const [editExamDescription, setEditExamDescription] = useState("");
          const [editExamAllowScore, setEditExamAllowScore] = useState(true);
          const [editExamAllowReview, setEditExamAllowReview] = useState(true);
          const [isEditingExamInfo, setIsEditingExamInfo] = useState(false);

          // Trạng thái bộ lọc đề thi phía Học sinh
          const [studentGradeFilter, setStudentGradeFilter] = useState("my_grade");

          // Trạng thái kết nối Server Mạng LAN / Internet
          const [isOnlineServer, setIsOnlineServer] = useState(false);

          // Tự động đồng bộ dữ liệu với Backend Server
          useEffect(() => {
            const fetchSyncData = async () => {
              try {
                const res = await fetch("/api/sync-all");
                if (res.ok) {
                  const data = await res.json();
                  setIsOnlineServer(true);
                  if (Array.isArray(data.students) && data.students.length > 0) setStudents(data.students);
                  if (Array.isArray(data.exams) && data.exams.length > 0) setExams(data.exams);
                  if (Array.isArray(data.results)) setResults(data.results);
                  if (Array.isArray(data.retakeRequests)) setRetakeRequests(data.retakeRequests);
                }
              } catch (e) {
                setIsOnlineServer(false);
              }
            };
            fetchSyncData();
            const interval = setInterval(fetchSyncData, 4000);
            return () => clearInterval(interval);
          }, []);

          // Đồng bộ LocalStorage làm giải pháp sao lưu offline
          useEffect(() => {
            localStorage.setItem("qc_students", JSON.stringify(students));
          }, [students]);

          useEffect(() => {
            localStorage.setItem("qc_active_student", JSON.stringify(activeStudent));
          }, [activeStudent]);

          useEffect(() => {
            localStorage.setItem("qc_exams", JSON.stringify(exams));
          }, [exams]);

          useEffect(() => {
            localStorage.setItem("qc_results", JSON.stringify(results));
          }, [results]);

          useEffect(() => {
            localStorage.setItem("qc_retake_requests", JSON.stringify(retakeRequests));
          }, [retakeRequests]);

          const removeVietnameseTones = (str) => {
            str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g,"a"); 
            str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g,"e"); 
            str = str.replace(/ì|í|ị|ỉ|ĩ/g,"i"); 
            str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g,"o"); 
            str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g,"u"); 
            str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g,"y"); 
            str = str.replace(/đ/g,"d");
            str = str.replace(/À|Á|Ạ|Ả|Ã|Â|Ầ|Ấ|Ậ|Ẩ|Ẫ|Ă|Ằ|Ắ|Ặ|Ẳ|Ẵ/g, "A");
            str = str.replace(/È|É|Ẹ|Ẻ|E|Ê|Ề|Ế|Ệ|Ể|Ễ/g, "E");
            str = str.replace(/Ì|Í|Ị|Ỉ|Ĩ/g, "I");
            str = str.replace(/Ò|Ó|Ọ|Ỏ|Õ|Ô|Ồ|Ố|Ộ|Ổ|Ỗ|Ơ|Ờ|Ớ|Ợ|Ở|Ỡ/g, "O");
            str = str.replace(/Ù|Ú|Ụ|Ủ|Ũ|Ư|Ừ|Ứ|Ự|Ử|Ữ/g, "U");
            str = str.replace(/Ỳ|Ý|Ỵ|Ỷ|Ỹ/g, "Y");
            str = str.replace(/Đ/g, "D");
            str = str.replace(/\u0300|\u0301|\u0309|\u0303|\u0323/g, "");
            str = str.replace(/\u02C6|\u0306|\u031B/g, "");
            str = str.replace(/ + /g," ");
            str = str.trim();
            str = str.replace(/!|@|%|\^|\*|\(|\)|\+|\=|\<|\>|\?|\/|,|\.|\:|\;|\'|\"|\&|\#|\[|\]|~|\$|_|`|-|{|}|\||\\/g," ");
            str = str.replace(/\s+/g, "");
            return str.toLowerCase();
          };

          const checkExamAccess = (exam) => {

              };

                const startStr = new Date(exam.startTime).toLocaleString("vi-VN");
                return {
                  accessible: false,
                  reason: "not_started",
                  message: `Chưa đến giờ mở đề thi. Đề thi sẽ mở lúc: ${startStr}`
                };

              if (exam.endTime && new Date(exam.endTime) < now) {

                  accessible: false,
                  reason: "ended",
                  message: `Đề thi đã hết hạn làm bài (Hạn chót: ${endStr})`

              return { status: "not_started", result: null };
            }
            if (approvedRetake) {
              return { status: "approved_retake", result: existingResult, retake: approvedRetake };
            }
            if (pendingRetake) {
              return { status: "pending_retake", result: existingResult, retake: pendingRetake };

                          <div className="bg-white rounded-2xl p-8 text-center border border-gray-100">
                            <i className="fas fa-search text-3xl text-gray-300 mb-2"></i>
                            <p className="text-gray-500 text-sm">Không có yêu cầu nào phù hợp với bộ lọc hiện tại.</p>
                          </div>
                        ) : (
                          <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse text-sm">
                              <thead>
                                <tr className="bg-gray-50 border-b border-gray-100 text-gray-500 font-bold">
                                  <th className="py-3 px-4">Tên học sinh</th>
                                  <th className="py-3 px-4">Lớp</th>
                                  <th className="py-3 px-4">Đề thi</th>
                                  <th className="py-3 px-4 text-center">Điểm lần trước</th>
                                  <th className="py-3 px-4">Thời gian gửi</th>
                                  <th className="py-3 px-4 text-center">Trạng thái</th>
                                  <th className="py-3 px-4 text-center">Thao tác</th>
                                </tr>
                              </thead>
                              <tbody>
                                {filteredRetakes.map((req) => (
                                  <tr key={req.id} className="border-b border-gray-50 hover:bg-slate-50 transition">
                                    <td className="py-3.5 px-4 font-bold text-gray-800">{req.studentName}</td>
                                    <td className="py-3.5 px-4 text-gray-600 font-semibold">{req.studentClass} (K{req.studentGrade})</td>
                                    <td className="py-3.5 px-4 text-gray-600 line-clamp-1 max-w-[180px]">{req.examTitle}</td>
                                    <td className="py-3.5 px-4 text-center font-bold text-gray-700">{req.previousScore} / 10</td>
                                    <td className="py-3.5 px-4 text-xs text-gray-500">{req.requestTime}</td>
                                    <td className="py-3.5 px-4 text-center">
                                      {req.status === "pending" ? (
                                        <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-1 rounded-full">
                                          Chờ duyệt
                                        </span>
                                      ) : req.status === "approved" ? (
                                        <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${req.used ? "bg-gray-100 text-gray-600" : "bg-emerald-100 text-emerald-800"}`}>
                                          {req.used ? "Đã thi lại xong" : "Đã duyệt (Chưa thi)"}
                                        </span>
                                      ) : (
                                        <span className="bg-rose-100 text-rose-800 text-xs font-bold px-2.5 py-1 rounded-full">
                                          Đã từ chối
                                        </span>
                                      )}
                                    </td>
                                    <td className="py-3.5 px-4 text-center">
                                      <div className="flex items-center justify-center gap-1.5">
                                        {req.status !== "approved" && (
                                          <button
                                            onClick={() => handleApproveRetake(req.id)}
                                            className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1 px-2.5 rounded-lg shadow transition"
                                            title="Duyệt cho học sinh thi lại"
                                          >
                                            <i className="fas fa-check mr-1"></i>Duyệt
                                          </button>
                                        )}
                                        {req.status === "pending" && (
                                          <button
                                            onClick={() => handleRejectRetake(req.id)}
                                            className="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold py-1 px-2.5 rounded-lg transition"
                                            title="Từ chối yêu cầu"
                                          >
                                            <i className="fas fa-times mr-1"></i>Từ chối
                                          </button>
                                        )}
                                        <button
                                          onClick={() => handleDeleteRetake(req.id)}
                                          className="text-gray-400 hover:text-red-500 text-xs font-bold p-1 transition"
                                          title="Xóa yêu cầu này"
                                        >
                                          <i className="fas fa-trash-alt"></i>
                                        </button>
                                      </div>
                                    </td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-gradient-to-br from-indigo-50/50 via-slate-50 to-blue-50/50 flex flex-col font-sans">
              <header className="bg-white shadow-md border-b-4 border-indigo-600 sticky top-0 z-40">
                <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="flex items-center gap-3">
                    <div className="flex items-center gap-3.5 cursor-pointer" onClick={() => {
                      if (activeStudent) setCurrentScreen("student_dashboard");
                      else if (currentScreen !== "teacher_dashboard") setCurrentScreen("login");
                    }}>
                      <span className="p-2.5 bg-indigo-600 text-white rounded-2xl shadow-md transform rotate-[-3deg] hover:rotate-0 transition duration-300">
                        <i className="fas fa-desktop text-2xl md:text-3xl"></i>
                      </span>
                      <div className="space-y-0.5">
                        <h1 className="text-xl md:text-2xl font-black text-indigo-900 tracking-tight leading-none uppercase">Tiểu học Quỳnh Châu</h1>
                        <p className="text-xs font-black text-amber-500 uppercase tracking-widest leading-none">Cổng Thi Tin học Trực tuyến</p>
                      </div>
                    </div>

                    {isOnlineServer ? (
                      <span className="hidden lg:flex items-center gap-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-extrabold px-3 py-1 rounded-full shadow-sm" title="Server đang hoạt động và tự động đồng bộ kết quả giữa tất cả máy tính">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        Đã kết nối Server Mạng (Đồng bộ các máy)
                      </span>
                    ) : (
                      <span className="hidden lg:flex items-center gap-1.5 bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-bold px-3 py-1 rounded-full" title="Chạy ở chế độ máy đơn LocalStorage. Khởi chạy node server.js để kết nối mạng các máy!">
                        <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                        Chế độ độc lập (Chưa nối Server)
                      </span>
                    )}
                  </div>

                  {activeStudent && currentScreen !== "exam" && (
                    <div className="flex items-center gap-4">
                      <div className="hidden md:flex flex-col items-end text-right">
                        <span className="font-bold text-gray-800 text-sm">{activeStudent.name}</span>
                        <span className="text-[11px] text-gray-400 font-black bg-gray-100 px-2 py-0.5 rounded">Lớp {activeStudent.class}</span>
                      </div>
                      <button
                        onClick={handleLogout}
                        className="bg-rose-50 hover:bg-rose-100 text-rose-600 hover:text-rose-700 border border-rose-100 font-bold text-xs px-4 py-2.5 rounded-xl transition duration-200 flex items-center gap-1.5"
                      >
                        <i className="fas fa-sign-out-alt"></i>Đăng xuất
                      </button>
                    </div>
                  )}
                </div>
              </header>

              <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
                {currentScreen === "login" && renderLogin()}
                {currentScreen === "register" && renderRegister()}
                {currentScreen === "student_dashboard" && renderStudentDashboard()}
                {currentScreen === "exam" && renderExam()}
                {currentScreen === "result" && renderResult()}
                {currentScreen === "teacher_dashboard" && renderTeacherDashboard()}
              </main>

              <footer className="bg-white py-6 border-t border-gray-100 text-center">
                <div className="max-w-7xl mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-3 text-xs text-gray-400 font-bold">
                  <p>© 2026 Trường Tiểu học Quỳnh Châu. Thiết kế dành cho học tập.</p>
                  <div className="flex gap-4">
                    {currentScreen !== "exam" && (
                      <button
                        onClick={() => {
                          if (currentScreen === "teacher_dashboard") {
                            if (activeStudent) setCurrentScreen("student_dashboard");
                            else setCurrentScreen("login");
                          } else {
                            const userPass = prompt("Vui lòng nhập mật khẩu quản trị viên (Giáo viên):");
                            if (userPass === "quynhchau2026") setCurrentScreen("teacher_dashboard");
                            else if (userPass !== null) alert("Mật khẩu không chính xác!");
                          }
                        }}
                        className="hover:text-indigo-600 hover:underline transition font-bold"
                      >
                        {currentScreen === "teacher_dashboard" ? "Trang học sinh" : "Cổng cho Giáo viên"}
                      </button>
                    )}
                  </div>
                </div>
              </footer>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>

</body>
</html>
